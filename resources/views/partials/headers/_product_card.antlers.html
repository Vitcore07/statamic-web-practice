<a
    href="{{ url }}"
    class="block rounded-xl min-w-max p-1 text-sm transition hover:bg-stone-100"
>
    <div class="flex gap-3">
        <img
            src="{{ glide:image width='44' fit='crop_focal' }}"
            class="size-11 object-cover"
        />
        <div class="flex flex-col">
            <p class="text-base text-black">{{ title }}</p>
            {{ if slot:subtitle }}
                {{ slot:subtitle }}
            {{ elseif sub_title }}
                <p class="text-xs">{{ sub_title }}</p>
            {{ /if }}
        </div>
    </div>
</a>
