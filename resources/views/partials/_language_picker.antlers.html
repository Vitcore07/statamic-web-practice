<div class="group relative hidden shrink-0 lg:block text-[#757575]">
    <div
        class="cursor-default rounded-full flex items-center gap-2 border border-stone-200 bg-white px-4 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-stone-800 transition group-hover:text-stone-950"
    >
        <span>{{ site:lang | upper }}</span>
        {{ svg src="icons/chevron-down" class="size-5 transform group-hover:rotate-180" }}
    </div>

    <div
        class="pointer-events-none absolute right-0 top-full opacity-0 transition duration-150 group-hover:pointer-events-auto group-hover:opacity-100"
    >
        <div
            class="mt-2 min-w-full rounded-xl bg-white p-2 shadow-lg ring-1 ring-black/5"
        >
            {{ locales sort="locale:lang:asc" current_first="false" }}
                {{ unless is_current }}
                    <a
                        href="{{ permalink }}"
                        class="block rounded-lg px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-stone-500 transition hover:bg-stone-50 hover:text-stone-900"
                    >
                        {{ locale:lang | upper }}
                    </a>
                {{ /unless }}
            {{ /locales }}
        </div>
    </div>
</div>
