<div class="flex h-full flex-col justify-between gap-6">
    {{ if text }}
        <p class="text-lg leading-8 tracking-tight text-stone-800">
            {{ text | nl2br }}
        </p>
    {{ /if }}

    <div class="grid items-center gap-4 sm:grid-cols-2">
        <div class="flex justify-start sm:justify-center">
            {{ if image }}
                <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-[linear-gradient(180deg,rgba(92,92,92,0.96)_0%,rgba(10,10,10,1)_100%)] p-2.5 shadow-[0_16px_30px_-22px_rgba(15,23,42,0.9),inset_0_1px_0_rgba(255,255,255,0.14),inset_0_8px_18px_rgba(255,255,255,0.08)] ring-1 ring-black/10">
                    <img
                        src="{{ image:url }}"
                        alt="{{ image:alt ?? image:title ?? company_name ?? '' }}"
                        class="max-h-full max-w-full object-contain {{ if image:url | ends_with('.svg') }}brightness-0 invert{{ /if }}"
                    >
                </div>
            {{ /if }}
        </div>

        {{ if company_name }}
            <p class="text-base font-medium tracking-tight text-stone-700 sm:text-right">
                {{ company_name }}
            </p>
        {{ /if }}
    </div>
</div>
