<section class="w-full px-6 py-12 {{ class }}">
    <h1 class="text-4xl text-center font-bold text-slate-800 mb-2">{{ heading }} <br> <span class="text-blue-500 text-xs">{{ id }}</span></h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10">
        {{ features_list }}
            <div class="feature bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow p-6 border-l-4 border-blue-500">
                <h2 class="text-xl font-semibold text-slate-700 mb-3">{{ heading }}</h2>
                <p class="text-slate-600 leading-relaxed">{{ description }}</p>
            </div>
        {{ /features_list }}
    </div>

    {{ if footer_label }}
        <div class="mt-10 pt-6 border-t border-slate-200 text-center">
            <p class="text-slate-600 font-bold">{{ footer_label }}</p> by APIS
        </div>
    {{ /if }}
</section>
