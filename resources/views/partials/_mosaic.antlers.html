<section class="w-full {{ class }}">
    <div class="flex flex-col gap-1">
        {{ rows }}
            {{ if type == 'row' }}
                <div class="flex items-stretch gap-1">
                    {{ items }}
                        <div
                            class="min-w-0 flex flex-1 items-center justify-center rounded-xl p-1 {{ if variant == 'colored_with_border' }}border border-black/10{{ /if }}"
                        >
                            {{ if type == 'markdown' && content }}
                                {{ content | markdown }}
                            {{ /if }}
                            {{ if type == 'image' && image }}
                                {{ image }}
                                    <img
                                        src="{{ url }}"
                                        alt="{{ alt ?? title ?? '' }}"
                                        class="block rounded-lg {{ if variant == 'faded' }}grayscale opacity-60{{ /if }}"
                                    />
                                {{ /image }}
                            {{ /if }}
                        </div>
                    {{ /items }}
                </div>
            {{ /if }}
        {{ /rows }}
    </div>
</section>
