<div data-apis-box class="relative mx-auto aspect-[300/286] w-full max-w-[30rem] overflow-hidden">
    <canvas data-apis-box-canvas class="absolute inset-0 block size-full"></canvas>
</div>

<script>
    (() => {
        if (window.__apisBoxRenderer) {
            window.__apisBoxRenderer.scan();

            return;
        }

        const logoImage = new Image();
        logoImage.src = '/assets/webbox-mark.svg';

        function makeLinear(ctx, x0, y0, x1, y1, stops) {
            const gradient = ctx.createLinearGradient(x0, y0, x1, y1);

            stops.forEach(([offset, color]) => {
                gradient.addColorStop(offset, color);
            });

            return gradient;
        }

        function makeRadial(ctx, x, y, innerRadius, outerRadius, stops) {
            const gradient = ctx.createRadialGradient(x, y, innerRadius, x, y, outerRadius);

            stops.forEach(([offset, color]) => {
                gradient.addColorStop(offset, color);
            });

            return gradient;
        }

        function withPolygon(ctx, points, callback) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let index = 1; index < points.length; index += 1) {
                ctx.lineTo(points[index].x, points[index].y);
            }

            ctx.closePath();
            ctx.clip();
            callback();
            ctx.restore();
        }

        function drawPolygonStroke(ctx, points, strokeStyle, lineWidth, shadowBlur = 0, shadowColor = 'transparent') {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let index = 1; index < points.length; index += 1) {
                ctx.lineTo(points[index].x, points[index].y);
            }

            ctx.closePath();
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = shadowColor;
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
        }

        function drawFace(ctx, points, unit, baseFill, accent) {
            const xs = points.map((point) => point.x);
            const ys = points.map((point) => point.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            withPolygon(ctx, points, () => {
                ctx.fillStyle = baseFill;
                ctx.fillRect(minX - unit, minY - unit, (maxX - minX) + unit * 2, (maxY - minY) + unit * 2);

                ctx.fillStyle = makeLinear(ctx, minX, minY, maxX, maxY, [
                    [0, 'rgba(255, 255, 255, 0.34)'],
                    [0.22, 'rgba(255, 255, 255, 0)'],
                    [0.74, 'rgba(255, 255, 255, 0)'],
                    [1, 'rgba(255, 255, 255, 0.22)'],
                ]);
                ctx.fillRect(minX - unit, minY - unit, (maxX - minX) + unit * 2, (maxY - minY) + unit * 2);

                ctx.fillStyle = accent;
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillRect(minX - unit, minY - unit, (maxX - minX) + unit * 2, (maxY - minY) + unit * 2);
                ctx.globalCompositeOperation = 'source-over';
            });
        }

        function drawIdleShimmer(ctx, points, centerX, centerY, radius, intensity = 1) {
            const xs = points.map((point) => point.x);
            const ys = points.map((point) => point.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            withPolygon(ctx, points, () => {
                ctx.fillStyle = makeRadial(ctx, centerX, centerY, radius * 0.08, radius, [
                    [0, `rgba(255, 255, 255, ${0.34 * intensity})`],
                    [0.22, `rgba(214, 248, 255, ${0.2 * intensity})`],
                    [0.48, `rgba(110, 226, 255, ${0.14 * intensity})`],
                    [1, 'rgba(110, 226, 255, 0)'],
                ]);
                ctx.fillRect(minX - radius, minY - radius, (maxX - minX) + radius * 2, (maxY - minY) + radius * 2);
            });
        }

        function drawPointerCaustic(ctx, points, centerX, centerY, radius, ringWidth = 0.32) {
            const xs = points.map((point) => point.x);
            const ys = points.map((point) => point.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            withPolygon(ctx, points, () => {
                ctx.fillStyle = makeRadial(ctx, centerX, centerY, radius * ringWidth, radius, [
                    [0, 'rgba(255, 255, 255, 1)'],
                    [0.16, 'rgba(255, 255, 255, 0.96)'],
                    [0.28, 'rgba(255, 255, 255, 0.45)'],
                    [0.46, 'rgba(69, 90, 228, 0.58)'],
                    [0.7, 'rgba(95, 214, 255, 0.12)'],
                    [1, 'rgba(95, 214, 255, 0)'],
                ]);
                ctx.fillRect(minX - radius, minY - radius, (maxX - minX) + radius * 2, (maxY - minY) + radius * 2);
            });
        }

        function drawLogo(ctx, points, unit) {
            if (!logoImage.complete) {
                return;
            }

            withPolygon(ctx, points, () => {
                const centerX = (points[0].x + points[1].x + points[2].x + points[3].x) / 4;
                const centerY = (points[0].y + points[1].y + points[2].y + points[3].y) / 4;

                ctx.save();
                ctx.translate(centerX - unit * 0.1, centerY + unit * 0.04);
                ctx.rotate(-0.5);
                ctx.globalAlpha = 0.92;
                ctx.drawImage(logoImage, -unit * 0.55, -unit * 0.34, unit * 1.1, unit * 0.72);
                ctx.restore();
            });
        }

        function drawApisText(ctx, points, unit) {
            withPolygon(ctx, points, () => {
                const centerX = (points[0].x + points[1].x + points[2].x + points[3].x) / 4;
                const centerY = (points[0].y + points[1].y + points[2].y + points[3].y) / 4;

                ctx.save();
                ctx.translate(centerX + unit * 0.08, centerY + unit * 0.18);
                ctx.rotate(-0.22);
                ctx.scale(1.02, 0.98);
                ctx.font = `italic 800 ${unit * 0.58}px Inter, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineJoin = 'round';
                ctx.lineWidth = unit * 0.08;
                ctx.strokeStyle = 'rgba(46, 92, 196, 0.95)';
                ctx.fillStyle = 'rgba(187, 234, 255, 0.96)';
                ctx.shadowBlur = unit * 0.18;
                ctx.shadowColor = 'rgba(137, 220, 255, 0.55)';
                ctx.strokeText('apis', 0, 0);
                ctx.fillText('apis', 0, 0);
                ctx.restore();
            });
        }

        function render(state, now) {
            const { ctx, width, height, pointer } = state;
            const elapsed = (now - state.startedAt) / 1000;
            const unit = Math.min(width, height) * 0.215;
            const centerX = width * 0.525;
            const centerY = height * 0.35 + Math.sin(elapsed * 1.1) * unit * 0.03;

            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = makeRadial(ctx, centerX, centerY + unit * 0.9, unit * 0.1, unit * 2.5, [
                [0, 'rgba(255, 255, 255, 0.18)'],
                [0.24, 'rgba(123, 229, 255, 0.18)'],
                [0.6, 'rgba(55, 112, 255, 0.14)'],
                [1, 'rgba(55, 112, 255, 0)'],
            ]);
            ctx.fillRect(0, 0, width, height);

            const points = {
                topBack: { x: centerX, y: centerY - unit * 1.18 },
                topRight: { x: centerX + unit * 1.34, y: centerY - unit * 0.52 },
                topFront: { x: centerX, y: centerY + unit * 0.08 },
                topLeft: { x: centerX - unit * 1.34, y: centerY - unit * 0.52 },
                leftBottom: { x: centerX - unit * 1.28, y: centerY + unit * 1.46 },
                bottomCenter: { x: centerX, y: centerY + unit * 2.1 },
                rightBottom: { x: centerX + unit * 1.28, y: centerY + unit * 1.46 },
            };

            const topFace = [points.topBack, points.topRight, points.topFront, points.topLeft];
            const leftFace = [points.topLeft, points.topFront, points.bottomCenter, points.leftBottom];
            const rightFace = [points.topRight, points.topFront, points.bottomCenter, points.rightBottom];

            drawFace(
                ctx,
                topFace,
                unit,
                makeLinear(ctx, points.topLeft.x, points.topBack.y, points.topRight.x, points.topFront.y, [
                    [0, 'rgba(244, 251, 255, 0.96)'],
                    [0.22, 'rgba(159, 240, 255, 0.92)'],
                    [0.56, 'rgba(67, 108, 239, 0.92)'],
                    [1, 'rgba(248, 252, 255, 0.98)'],
                ]),
                makeRadial(ctx, centerX, centerY - unit * 0.28, unit * 0.1, unit * 1.35, [
                    [0, 'rgba(17, 29, 72, 0.78)'],
                    [0.4, 'rgba(26, 58, 132, 0.48)'],
                    [1, 'rgba(17, 29, 72, 0)'],
                ])
            );

            drawFace(
                ctx,
                leftFace,
                unit,
                makeLinear(ctx, points.topLeft.x, points.topLeft.y, points.leftBottom.x, points.leftBottom.y, [
                    [0, 'rgba(251, 253, 255, 0.99)'],
                    [0.16, 'rgba(163, 240, 255, 0.84)'],
                    [0.58, 'rgba(28, 45, 100, 0.94)'],
                    [1, 'rgba(255, 255, 255, 0.99)'],
                ]),
                makeRadial(ctx, centerX - unit * 0.56, centerY + unit * 0.86, unit * 0.08, unit * 1.45, [
                    [0, 'rgba(22, 34, 83, 0.84)'],
                    [0.48, 'rgba(36, 67, 149, 0.28)'],
                    [1, 'rgba(22, 34, 83, 0)'],
                ])
            );

            drawFace(
                ctx,
                rightFace,
                unit,
                makeLinear(ctx, points.topRight.x, points.topRight.y, points.rightBottom.x, points.rightBottom.y, [
                    [0, 'rgba(251, 253, 255, 0.99)'],
                    [0.18, 'rgba(167, 239, 255, 0.82)'],
                    [0.56, 'rgba(26, 45, 102, 0.95)'],
                    [1, 'rgba(255, 255, 255, 0.99)'],
                ]),
                makeRadial(ctx, centerX + unit * 0.64, centerY + unit * 0.88, unit * 0.08, unit * 1.5, [
                    [0, 'rgba(22, 34, 83, 0.84)'],
                    [0.48, 'rgba(36, 67, 149, 0.28)'],
                    [1, 'rgba(22, 34, 83, 0)'],
                ])
            );

            const idleTopX = centerX + Math.sin(elapsed * 0.82) * unit * 0.62;
            const idleTopY = centerY - unit * 0.26 + Math.cos(elapsed * 0.96) * unit * 0.12;
            const idleLeftX = centerX - unit * 0.76 + Math.sin(elapsed * 0.7 + 0.8) * unit * 0.24;
            const idleLeftY = centerY + unit * 1.06 + Math.cos(elapsed * 0.94 + 0.5) * unit * 0.3;
            const idleRightX = centerX + unit * 0.76 + Math.sin(elapsed * 0.74 + 2.1) * unit * 0.24;
            const idleRightY = centerY + unit * 1.02 + Math.cos(elapsed * 0.9 + 1.2) * unit * 0.3;

            drawIdleShimmer(ctx, topFace, idleTopX, idleTopY, unit * 1.02, 1);
            drawIdleShimmer(ctx, leftFace, idleLeftX, idleLeftY, unit * 0.96, 0.75);
            drawIdleShimmer(ctx, rightFace, idleRightX, idleRightY, unit * 0.96, 0.8);

            const pointerTopX = centerX + pointer.x * unit * 0.88;
            const pointerTopY = centerY - unit * 0.3 + pointer.y * unit * 0.28;
            const pointerLeftX = centerX - unit * 0.68 + pointer.x * unit * 0.32;
            const pointerLeftY = centerY + unit * 1.04 + pointer.y * unit * 0.52;
            const pointerRightX = centerX + unit * 0.68 + pointer.x * unit * 0.32;
            const pointerRightY = centerY + unit * 1.02 + pointer.y * unit * 0.52;

            drawPointerCaustic(ctx, topFace, pointerTopX, pointerTopY, unit * 0.9, 0.28);
            drawPointerCaustic(ctx, leftFace, pointerLeftX, pointerLeftY, unit * 0.72, 0.36);
            drawPointerCaustic(ctx, rightFace, pointerRightX, pointerRightY, unit * 0.72, 0.36);

            const edgeStroke = makeLinear(ctx, centerX - unit * 1.5, centerY - unit * 1.2, centerX + unit * 1.5, centerY + unit * 2.1, [
                [0, 'rgba(255, 255, 255, 0.98)'],
                [0.26, 'rgba(118, 234, 255, 0.98)'],
                [0.68, 'rgba(70, 102, 255, 0.98)'],
                [1, 'rgba(255, 255, 255, 0.98)'],
            ]);

            drawPolygonStroke(ctx, topFace, edgeStroke, unit * 0.082, unit * 0.24, 'rgba(127, 225, 255, 0.78)');
            drawPolygonStroke(ctx, leftFace, edgeStroke, unit * 0.082, unit * 0.22, 'rgba(127, 225, 255, 0.72)');
            drawPolygonStroke(ctx, rightFace, edgeStroke, unit * 0.082, unit * 0.22, 'rgba(102, 127, 255, 0.74)');
            drawPolygonStroke(ctx, topFace, 'rgba(255, 255, 255, 0.86)', unit * 0.024);
            drawPolygonStroke(ctx, leftFace, 'rgba(255, 255, 255, 0.84)', unit * 0.024);
            drawPolygonStroke(ctx, rightFace, 'rgba(255, 255, 255, 0.84)', unit * 0.024);

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points.topFront.x, points.topFront.y);
            ctx.lineTo(points.bottomCenter.x, points.bottomCenter.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.94)';
            ctx.lineWidth = unit * 0.052;
            ctx.shadowBlur = unit * 0.16;
            ctx.shadowColor = 'rgba(173, 240, 255, 0.62)';
            ctx.stroke();
            ctx.restore();

            drawLogo(ctx, leftFace, unit);
            drawApisText(ctx, rightFace, unit);
        }

        function mount(root) {
            if (root.dataset.apisBoxMounted === 'true') {
                return;
            }

            const canvas = root.querySelector('[data-apis-box-canvas]');

            if (!canvas) {
                return;
            }

            const ctx = canvas.getContext('2d');

            if (!ctx) {
                return;
            }

            root.dataset.apisBoxMounted = 'true';

            const state = {
                root,
                canvas,
                ctx,
                width: 0,
                height: 0,
                startedAt: performance.now(),
                pointer: { x: 0, y: 0 },
            };

            const resize = () => {
                const rect = root.getBoundingClientRect();
                const ratio = Math.min(window.devicePixelRatio || 1, 2);

                state.width = Math.max(rect.width, 1);
                state.height = Math.max(rect.height, 1);
                canvas.width = Math.round(state.width * ratio);
                canvas.height = Math.round(state.height * ratio);
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            };

            const onPointerMove = (event) => {
                const rect = root.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width;
                const y = (event.clientY - rect.top) / rect.height;

                state.pointer.x = (x - 0.5) * 2;
                state.pointer.y = (y - 0.5) * 2;
            };

            const onPointerLeave = () => {
                state.pointer.x *= 0.2;
                state.pointer.y *= 0.2;
            };

            const observer = new ResizeObserver(() => {
                resize();
            });

            observer.observe(root);
            root.addEventListener('pointermove', onPointerMove);
            root.addEventListener('pointerleave', onPointerLeave);
            resize();

            const frame = (now) => {
                state.pointer.x *= 0.95;
                state.pointer.y *= 0.95;
                render(state, now);
                state.raf = window.requestAnimationFrame(frame);
            };

            state.raf = window.requestAnimationFrame(frame);
        }

        window.__apisBoxRenderer = {
            scan() {
                document.querySelectorAll('[data-apis-box]').forEach(mount);
            },
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.__apisBoxRenderer.scan();
            }, { once: true });
        } else {
            window.__apisBoxRenderer.scan();
        }
    })();
</script>
