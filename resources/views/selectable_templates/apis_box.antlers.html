<div
    data-apis-box-template
    class="relative mx-auto aspect-[300/286] w-full max-w-[30rem] overflow-hidden"
>
    <div class="pointer-events-none absolute size-5 opacity-0"></div>
    <canvas
        data-apis-box-canvas
        class="absolute inset-0 block size-full opacity-100 transition-opacity duration-100 ease-in-out"
    ></canvas>
</div>

<script>
    (() => {
        if (window.__apisBoxTemplate) {
            window.__apisBoxTemplate.scan();

            return;
        }

        const markImage = new Image();
        markImage.src = '/assets/webbox-mark.svg';

        function createGradient(ctx, x0, y0, x1, y1, stops) {
            const gradient = ctx.createLinearGradient(x0, y0, x1, y1);

            stops.forEach(([offset, color]) => {
                gradient.addColorStop(offset, color);
            });

            return gradient;
        }

        function createRadial(ctx, x, y, innerRadius, outerRadius, stops) {
            const gradient = ctx.createRadialGradient(x, y, innerRadius, x, y, outerRadius);

            stops.forEach(([offset, color]) => {
                gradient.addColorStop(offset, color);
            });

            return gradient;
        }

        function drawPath(ctx, points, { fill = null, stroke = null, lineWidth = 1, shadowBlur = 0, shadowColor = 'transparent' } = {}) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let index = 1; index < points.length; index += 1) {
                ctx.lineTo(points[index].x, points[index].y);
            }

            ctx.closePath();

            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }

            if (stroke) {
                ctx.shadowBlur = shadowBlur;
                ctx.shadowColor = shadowColor;
                ctx.strokeStyle = stroke;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawWire(ctx, from, to, { stroke, lineWidth, shadowBlur = 0, shadowColor = 'transparent' }) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = shadowColor;
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
        }

        function resize(state) {
            const bounds = state.root.getBoundingClientRect();
            const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

            state.width = Math.max(bounds.width, 1);
            state.height = Math.max(bounds.height, 1);
            state.canvas.width = Math.round(state.width * devicePixelRatio);
            state.canvas.height = Math.round(state.height * devicePixelRatio);
            state.ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        }

        function drawFaceDetails(ctx, state, points) {
            if (!markImage.complete) {
                return;
            }

            const leftCenterX = (points.topLeft.x + points.bottomCenter.x + points.leftOuter.x + points.topInner.x) / 4;
            const leftCenterY = (points.topLeft.y + points.bottomCenter.y + points.leftOuter.y + points.topInner.y) / 4;

            ctx.save();
            ctx.translate(leftCenterX, leftCenterY);
            ctx.rotate(-0.38);
            ctx.globalAlpha = 0.96;
            ctx.drawImage(markImage, -state.unit * 0.42, -state.unit * 0.28, state.unit * 0.84, state.unit * 0.58);
            ctx.restore();

            const rightCenterX = (points.topRight.x + points.bottomCenter.x + points.rightOuter.x + points.topInner.x) / 4;
            const rightCenterY = (points.topRight.y + points.bottomCenter.y + points.rightOuter.y + points.topInner.y) / 4;

            ctx.save();
            ctx.translate(rightCenterX, rightCenterY);
            ctx.rotate(-0.22);
            ctx.scale(1, 0.92);
            ctx.fillStyle = '#2d72d8';
            ctx.shadowBlur = state.unit * 0.14;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.font = `italic 700 ${state.unit * 0.42}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('apis', 0, 0);
            ctx.restore();
        }

        function draw(state, now) {
            const ctx = state.ctx;

            if (!ctx) {
                return;
            }

            const elapsed = (now - state.startTime) / 1000;
            const driftX = state.pointer.x * state.width * 0.04;
            const driftY = state.pointer.y * state.height * 0.03;
            const floatY = Math.sin(elapsed * 1.15) * state.height * 0.018;
            const pulse = (Math.sin(elapsed * 1.8) + 1) * 0.5;
            const centerX = state.width * 0.57 + driftX;
            const centerY = state.height * 0.53 + driftY + floatY;
            const unit = Math.min(state.width, state.height) * 0.23;

            state.unit = unit;

            ctx.clearRect(0, 0, state.width, state.height);

            ctx.save();
            ctx.fillStyle = createRadial(ctx, centerX, centerY, unit * 0.15, unit * 1.8, [
                [0, 'rgba(255, 255, 255, 0.36)'],
                [0.18, 'rgba(113, 226, 255, 0.34)'],
                [0.45, 'rgba(54, 122, 255, 0.24)'],
                [1, 'rgba(54, 122, 255, 0)'],
            ]);
            ctx.beginPath();
            ctx.arc(centerX, centerY, unit * 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const points = {
                topBack: { x: centerX, y: centerY - unit * 1.08 },
                topRight: { x: centerX + unit * 1.18, y: centerY - unit * 0.42 },
                topInner: { x: centerX, y: centerY + unit * 0.04 },
                topLeft: { x: centerX - unit * 1.18, y: centerY - unit * 0.42 },
                leftOuter: { x: centerX - unit * 1.16, y: centerY + unit * 1.26 },
                bottomCenter: { x: centerX, y: centerY + unit * 0.84 },
                rightOuter: { x: centerX + unit * 1.16, y: centerY + unit * 1.26 },
            };

            const topGradient = createGradient(
                ctx,
                points.topLeft.x,
                points.topBack.y,
                points.topRight.x,
                points.topInner.y,
                [
                    [0, 'rgba(210, 245, 255, 0.56)'],
                    [0.35, 'rgba(118, 235, 255, 0.82)'],
                    [0.7, 'rgba(128, 181, 255, 0.78)'],
                    [1, 'rgba(245, 249, 255, 0.66)'],
                ]
            );

            const leftGradient = createGradient(
                ctx,
                points.topLeft.x,
                points.topLeft.y,
                points.leftOuter.x,
                points.leftOuter.y,
                [
                    [0, 'rgba(201, 246, 255, 0.6)'],
                    [0.42, 'rgba(114, 195, 255, 0.78)'],
                    [1, 'rgba(255, 255, 255, 0.92)'],
                ]
            );

            const rightGradient = createGradient(
                ctx,
                points.topRight.x,
                points.topRight.y,
                points.rightOuter.x,
                points.rightOuter.y,
                [
                    [0, 'rgba(160, 241, 255, 0.68)'],
                    [0.46, 'rgba(88, 130, 255, 0.76)'],
                    [1, 'rgba(255, 255, 255, 0.94)'],
                ]
            );

            const edgeStroke = createGradient(
                ctx,
                centerX - unit * 1.4,
                centerY - unit * 1.1,
                centerX + unit * 1.3,
                centerY + unit * 1.2,
                [
                    [0, 'rgba(240, 250, 255, 0.92)'],
                    [0.3, 'rgba(103, 236, 255, 0.98)'],
                    [0.66, 'rgba(70, 124, 255, 0.92)'],
                    [1, 'rgba(255, 255, 255, 0.92)'],
                ]
            );

            drawPath(ctx, [points.topBack, points.topRight, points.topInner, points.topLeft], {
                fill: topGradient,
                stroke: edgeStroke,
                lineWidth: unit * 0.08,
                shadowBlur: unit * (0.22 + pulse * 0.05),
                shadowColor: 'rgba(114, 215, 255, 0.75)',
            });

            drawPath(ctx, [points.topLeft, points.topInner, points.bottomCenter, points.leftOuter], {
                fill: leftGradient,
                stroke: edgeStroke,
                lineWidth: unit * 0.08,
                shadowBlur: unit * (0.18 + pulse * 0.04),
                shadowColor: 'rgba(114, 215, 255, 0.65)',
            });

            drawPath(ctx, [points.topRight, points.topInner, points.bottomCenter, points.rightOuter], {
                fill: rightGradient,
                stroke: edgeStroke,
                lineWidth: unit * 0.08,
                shadowBlur: unit * (0.18 + pulse * 0.04),
                shadowColor: 'rgba(78, 130, 255, 0.62)',
            });

            drawWire(ctx, points.topBack, points.bottomCenter, {
                stroke: 'rgba(255, 255, 255, 0.78)',
                lineWidth: unit * 0.045,
                shadowBlur: unit * 0.12,
                shadowColor: 'rgba(166, 245, 255, 0.55)',
            });

            drawWire(ctx, points.topLeft, points.leftOuter, {
                stroke: 'rgba(247, 252, 255, 0.85)',
                lineWidth: unit * 0.04,
            });

            drawWire(ctx, points.topRight, points.rightOuter, {
                stroke: 'rgba(245, 250, 255, 0.88)',
                lineWidth: unit * 0.04,
            });

            drawFaceDetails(ctx, state, points);
        }

        function setup(root) {
            if (root.dataset.apisBoxMounted === 'true') {
                return;
            }

            const canvas = root.querySelector('[data-apis-box-canvas]');

            if (!canvas) {
                return;
            }

            root.dataset.apisBoxMounted = 'true';

            const state = {
                root,
                canvas,
                ctx: canvas.getContext('2d'),
                startTime: performance.now(),
                pointer: { x: 0, y: 0 },
                frame: 0,
            };

            const handleMove = (event) => {
                const bounds = root.getBoundingClientRect();

                state.pointer.x = ((event.clientX - bounds.left) / bounds.width - 0.5) * 2;
                state.pointer.y = ((event.clientY - bounds.top) / bounds.height - 0.5) * 2;
            };

            const handleLeave = () => {
                state.pointer.x *= 0.35;
                state.pointer.y *= 0.35;
            };

            const resizeObserver = new ResizeObserver(() => {
                resize(state);
            });

            resizeObserver.observe(root);
            root.addEventListener('pointermove', handleMove);
            root.addEventListener('pointerleave', handleLeave);

            resize(state);

            const render = (now) => {
                state.pointer.x *= 0.94;
                state.pointer.y *= 0.94;
                draw(state, now);
                state.frame = window.requestAnimationFrame(render);
            };

            state.frame = window.requestAnimationFrame(render);
        }

        window.__apisBoxTemplate = {
            scan() {
                document.querySelectorAll('[data-apis-box-template]').forEach(setup);
            },
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.__apisBoxTemplate.scan();
            }, { once: true });
        } else {
            window.__apisBoxTemplate.scan();
        }
    })();
</script>
