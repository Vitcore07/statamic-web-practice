<section class="mx-auto max-w-6xl px-6 py-16 sm:px-8 lg:px-10">
    <div class="overflow-hidden rounded-[2rem] border border-rose-200 bg-rose-50 px-6 py-8 shadow-sm sm:px-8 sm:py-10 lg:px-10 lg:py-12">
        <div class="grid items-center gap-8 lg:gap-12 {{ if image }}lg:grid-cols-2{{ /if }}">
            <div class="{{ if image_position == 'right' }}lg:order-2{{ /if }}">
                {{ if image }}
                    {{ image }}
                        <figure class="overflow-hidden rounded-3xl border border-rose-300 bg-white shadow-sm">
                            <img
                                src="{{ url }}"
                                alt="{{ alt ?? title ?? '' }}"
                                class="h-full w-full object-cover"
                            >
                        </figure>
                    {{ /image }}
                {{ /if }}
            </div>

            <div class="max-w-none text-stone-800 [&_blockquote]:rounded-[1.5rem] [&_blockquote]:border-l-4 [&_blockquote]:border-rose-500 [&_blockquote]:bg-white/85 [&_blockquote]:px-6 [&_blockquote]:py-5 [&_blockquote]:text-lg [&_blockquote]:leading-8 [&_blockquote]:font-medium [&_blockquote]:italic [&_blockquote]:text-stone-900 [&_blockquote]:shadow-sm [&_p]:leading-8 {{ if image_position == 'right' }}lg:order-1{{ /if }}">
                {{ content }}
            </div>
        </div>
    </div>
</section>
