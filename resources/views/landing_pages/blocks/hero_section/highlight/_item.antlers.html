<div class="flex h-full flex-col justify-between gap-6">
    {{ if text }}
        <p class="text-lg leading-8 tracking-tight text-stone-800">
            {{ text | nl2br }}
        </p>
    {{ /if }}

    <div class="grid items-center gap-4 sm:grid-cols-2">
        <div class="flex justify-start sm:justify-center">
            {{ if image }}
                {{ image }}
                    <img
                        src="{{ url }}"
                        alt="{{ alt ?? title ?? company_name ?? '' }}"
                        class="h-12 w-auto object-contain"
                    >
                {{ /image }}
            {{ /if }}
        </div>

        {{ if company_name }}
            <p class="text-base font-medium tracking-tight text-stone-700 sm:text-right">
                {{ company_name }}
            </p>
        {{ /if }}
    </div>
</div>
