title: Card
fields:
  -
    handle: background_image
    field:
      type: assets
      display: 'Background Image'
      container: assets
      max_files: 1
      localizable: true
  -
    handle: content_surface
    field:
      type: button_group
      display: 'Content Surface'
      instructions: 'Choose whether content sits directly on the card image or on a solid background panel.'
      default: direct
      localizable: true
      options:
        direct: 'Direct on Card'
        panel: 'Solid Background'
  -
    handle: content
    field:
      type: replicator
      display: Content
      localizable: true
      collapse: true
      sets:
        content:
          display: Content
          sets:
            markdown:
              display: Markdown
              icon: text-formatting-markdown
              fields:
                -
                  handle: hide_separator
                  field:
                    type: toggle
                    display: 'Hide Separator'
                    default: false
                    localizable: true
                -
                  handle: content
                  field:
                    type: markdown
                    display: Content
                    localizable: true
            icon_list:
              display: 'List with Icons'
              icon: text-formatting-list-bullets
              fields:
                -
                  handle: hide_separator
                  field:
                    type: toggle
                    display: 'Hide Separator'
                    default: false
                    localizable: true
                -
                  handle: items
                  field:
                    type: grid
                    display: Items
                    localizable: true
                    fields:
                      -
                        handle: icon
                        field:
                          type: apis_icon
                          display: Icon
                          localizable: true
                          width: 33
                      -
                        handle: text
                        field:
                          type: text
                          display: Text
                          localizable: true
                          width: 67
            image_with_copy:
              display: 'Image with Copy'
              icon: media-image-picture-orientation
              fields:
                -
                  handle: hide_separator
                  field:
                    type: toggle
                    display: 'Hide Separator'
                    default: false
                    localizable: true
                -
                  import: image_with_copy
            mosaic:
              display: Mosaic
              icon: layout-grid-dots
              fields:
                -
                  handle: hide_separator
                  field:
                    type: toggle
                    display: 'Hide Separator'
                    default: false
                    localizable: true
                -
                  import: mosaic
