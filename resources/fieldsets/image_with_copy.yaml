title: 'Image with Copy'
fields:
  -
    handle: variant
    field:
      type: button_group
      display: Variant
      default: blue
      localizable: true
      options:
        blue: Blue
        red: Red
      width: 50
  -
    handle: image_position
    field:
      type: button_group
      display: 'Image Position'
      default: left
      localizable: true
      options:
        left: Left
        right: Right
      width: 50
  -
    handle: image
    field:
      type: assets
      display: Image
      container: assets
      max_files: 1
      localizable: true
      width: 50
  -
    handle: content
    field:
      type: bard
      display: Content
      localizable: true
      width: 50
