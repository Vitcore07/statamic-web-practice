title: 'Hero Title'
fields:
  -
    handle: title
    field:
      type: textarea
      display: Title
      localizable: true
  -
    handle: subtitle
    field:
      type: textarea
      display: Subtitle
      localizable: true
  -
    handle: image_position
    field:
      type: button_group
      display: 'Image Position'
      default: right
      localizable: true
      options:
        left: Left
        right: Right
  -
    import: blocks.media_slot
  -
    handle: cta_label
    field:
      type: text
      display: 'CTA Label'
      localizable: true
      width: 50
  -
    handle: cta_url
    field:
      type: text
      display: 'CTA URL'
      localizable: true
      width: 50
  -
    handle: secondary_label
    field:
      type: text
      display: 'Secondary Label'
      localizable: true
      width: 50
  -
    handle: secondary_url
    field:
      type: text
      display: 'Secondary URL'
      localizable: true
      width: 50
