title: 'Hero Title'
fields:
  -
    handle: title
    field:
      type: textarea
      display: Title
      localizable: true
  -
    handle: image_position
    field:
      type: button_group
      display: 'Image Position'
      default: right
      localizable: true
      options:
        left: Left
        right: Right
  -
    handle: subtitle
    field:
      buttons:
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - image
        - table
        - underline
      container: assets
      remove_empty_nodes: false
      type: bard
      display: Subtitle
      localizable: false
  -
    import: media_slot
  -
    handle: cta_label
    field:
      type: text
      display: 'CTA Label'
      localizable: true
      width: 50
  -
    handle: cta_url
    field:
      type: text
      display: 'CTA URL'
      localizable: true
      width: 50
  -
    handle: secondary_label
    field:
      type: text
      display: 'Secondary Label'
      localizable: true
      width: 50
  -
    handle: secondary_url
    field:
      type: text
      display: 'Secondary URL'
      localizable: true
      width: 50
