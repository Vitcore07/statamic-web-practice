title: Main-feature
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: role
            field:
              type: text
              display: Role
          -
            handle: desc
            field:
              type: textarea
              display: Desc
          -
            handle: logo
            field:
              container: assets
              type: assets
              display: Logo
          -
            handle: img_desc
            field:
              type: text
              display: img-desc
          -
            handle: stats
            field:
              type: grid
              display: Stats
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                -
                  handle: amount
                  field:
                    type: text
                    display: Amount
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  new_tab:
    display: 'New Tab'
    sections:
      -
        display: 'New Section'
