tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              validate:
                - required
          -
            handle: page_sections
            field:
              type: replicator
              display: Structure
              localizable: true
              collapse: true
              validate:
                - required
              sets:
                content:
                  display: Content
                  sets:
                    image_with_copy:
                      display: 'Image with Copy'
                      icon: media-image-picture-orientation
                      image: image-with-copy-preview.svg
                      fields:
                        -
                          import: image_with_copy
                    hero_section:
                      display: 'Hero Section'
                      icon: layout-top-panel-1
                      fields:
                        -
                          import: hero_section
                    card:
                      display: Card
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: card
                    row:
                      display: Row
                      icon: layout-three-columns
                      fields:
                        -
                          import: row
                    mosaic:
                      display: Mosaic
                      icon: layout-grid-dots
                      fields:
                        -
                          import: mosaic
                    spacer:
                      display: Spacer
                      icon: arrows-diagonal-up-right-down-left-center
                      fields:
                        -
                          import: spacer
                    highlight_card:
                      display: 'Highlight Card'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: highlight_card
                    highlight_cards:
                      display: 'Highlight Cards'
                      icon: layout-grid-dots
                      image: highlight-cards-preview.svg
                      fields:
                        -
                          import: highlight_cards
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
              localizable: false
          -
            handle: products
            field:
              type: terms
              taxonomies:
                - products
              display: Products
              mode: select
              localizable: false
title: 'Landing Page'
