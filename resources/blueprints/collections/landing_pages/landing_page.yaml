tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              localizable: true
              required: true
              validate:
                - required
          -
            handle: page_sections
            field:
              type: replicator
              display: Structure
              localizable: true
              validate:
                - required
              sets:
                content:
                  display: Content
                  sets:
                    image_with_copy:
                      display: 'Image with Copy'
                      icon: media-image-picture-orientation
                      image: image-with-copy-preview.svg
                      fields:
                        -
                          import: blocks.image_with_copy
                    highlight_card:
                      display: 'Highlight Card'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: blocks.highlight_card
                    highlight_cards:
                      display: 'Highlight Cards'
                      icon: layout-grid-dots
                      image: highlight-cards-preview.svg
                      fields:
                        -
                          import: blocks.highlight_cards
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: products
            field:
              type: terms
              taxonomies:
                - products
              display: Products
              mode: select
title: 'Landing Page'
