x-app-build: &app-build
    context: .
    dockerfile: docker/frankenphp/Dockerfile
    target: prod
    args:
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'

x-app-environment: &app-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    LOG_CHANNEL: stderr
    LOG_LEVEL: '${LOG_LEVEL:-info}'
    DB_CONNECTION: sqlite
    DB_DATABASE: /app/database/database.sqlite
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    SERVER_NAME: '${FRANKENPHP_SERVER_NAME:-:80}'
    TRUSTED_PROXIES: '${TRUSTED_PROXIES:-*}'
    RUN_OPTIMIZE: '${RUN_OPTIMIZE:-1}'
    RUN_STORAGE_LINK: '${RUN_STORAGE_LINK:-1}'

x-app-volumes: &app-volumes
    - './content:/app/content:z'
    - './database:/app/database:z'
    - './users:/app/users:z'
    - './resources/users:/app/resources/users:z'
    - './public/assets:/app/public/assets:z'
    - './storage:/app/storage:z'
    - './docker-data/statamic-img-cache:/app/public/img:z'

x-app-service: &app-service
    image: '${APP_IMAGE:-cms-frankenphp}'
    build: *app-build
    env_file:
        - '${APP_ENV_FILE:-.env}'
    restart: unless-stopped
    init: true
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
        redis:
            condition: service_healthy
    networks:
        - internal

services:
    server:
        <<: *app-service
        environment:
            <<: *app-environment
            CONTAINER_ROLE: server
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-0}'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - './content:/app/content:z'
            - './database:/app/database:z'
            - './users:/app/users:z'
            - './resources/users:/app/resources/users:z'
            - './public/assets:/app/public/assets:z'
            - './storage:/app/storage:z'
            - './docker-data/statamic-img-cache:/app/public/img:z'
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/up || exit 1']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

    queue:
        <<: *app-service
        environment:
            <<: *app-environment
            CONTAINER_ROLE: queue

    scheduler:
        <<: *app-service
        environment:
            <<: *app-environment
            CONTAINER_ROLE: scheduler

    redis:
        image: 'redis:8.6.2-alpine'
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - 'redis_data:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10
        networks:
            - internal

networks:
    internal:
        driver: bridge

volumes:
    redis_data:
